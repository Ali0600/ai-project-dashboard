name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the code to typecheck/lint/test/build.
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Don't leave the job's token in .git/config, where any dependency's install script
          # could read it during `npm ci`. Nothing after checkout needs git auth.
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
